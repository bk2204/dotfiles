---
v0:
  socket:
    autoprune: true
  clipboard:
    if: true
    backend: default
  commands:
    noop:
      if: true
      command: '!true'
    printf:
      if: true
      command: '!f() { printf "$@"; };f'
    clip:
      if: true
      command: '!dct-clip'
    browser:
      if: true
      command: '!$BROWSER'
    gvi:
      if: true
      command: '!f() { export REMOTE_HOST=%(sq:cenv:HOSTNAME) CODESPACE_NAME=%(sq:cenv:CODESPACE_NAME) CWD=%(sq:cenv:PWD) NEOVIDE_FORK=1; if command -v neovide >/dev/null 2>&1; then neovide --neovim-bin "$HOME/bin/ssh-nvim" "$@"; else nvim-gtk --nvim-bin-path "$HOME/bin/ssh-nvim" "$@"; fi; };f'
    sha256sum:
      if: true
      command: '!f() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$@"; else shasum -a 256 "$@"; fi; };f'
  fs:
    test:
      if: true
      location: /tmp/user/1000
    default:
      if: true
      location: '!printf "%%s/data/remote" "$HOME"'
  proxy:
    ssh:
      timeout:
        poll_ms: 100
        server_read_ms: 100
  credential:
    if: true
    control: |
      !f() {
        case $0 in
          create-location)
            echo /memory/vault/;;
        esac
      }; f
    backends:
      - name: memory
        type: memory
        if: true
