---
files:
    kglobalshortcutsrc:
        groups:
            kwin:
                Switch One Desktop Down: "Ctrl+Alt+Down,Meta+Ctrl+Down,Switch One Desktop Down"
                Switch One Desktop Up: "Ctrl+Alt+Up,Meta+Ctrl+Up,Switch One Desktop Up"
                Switch One Desktop to the Left: "Ctrl+Alt+Left,Meta+Ctrl+Left,Switch One Desktop to the Left"
                Switch One Desktop to the Right: "Ctrl+Alt+Right,Meta+Ctrl+Right,Switch One Desktop to the Right"
                Switch to Desktop 1: "Ctrl+F1,Ctrl+F1,Switch to Desktop 1"
                Switch to Desktop 2: "Ctrl+F2,Ctrl+F2,Switch to Desktop 2"
                Switch to Desktop 3: "Ctrl+F3,Ctrl+F3,Switch to Desktop 3"
                Switch to Desktop 4: "Ctrl+F4,Ctrl+F4,Switch to Desktop 4"
                Switch to Desktop 5: "Ctrl+F5,Ctrl+F5,Switch to Desktop 5"
                Switch to Desktop 5: "Ctrl+F6,Ctrl+F6,Switch to Desktop 6"
                Window One Desktop Down: "Meta+Ctrl+Shift+Down,Meta+Ctrl+Shift+Down,Window One Desktop Down"
                Window One Desktop Up: "Meta+Ctrl+Shift+Up,Meta+Ctrl+Shift+Up,Window One Desktop Up"
                Window One Desktop to the Left: "Meta+Ctrl+Shift+Left,Meta+Ctrl+Shift+Left,Window One Desktop to the Left"
                Window One Desktop to the Right: "Meta+Ctrl+Shift+Right,Meta+Ctrl+Shift+Right,Window One Desktop to the Right"
                Window to Desktop 1: "Meta+Ctrl+F1,,Window to Desktop 1"
                Window to Desktop 2: "Meta+Ctrl+F2,,Window to Desktop 2"
                Window to Desktop 3: "Meta+Ctrl+F3,,Window to Desktop 3"
                Window to Desktop 4: "Meta+Ctrl+F4,,Window to Desktop 4"
                Window to Desktop 5: "Meta+Ctrl+F5,,Window to Desktop 5"
                Window to Desktop 6: "Meta+Ctrl+F6,,Window to Desktop 6"
                Window to Next Screen: "Meta+Shift+Right,Meta+Shift+Right,Move Window to Next Screen"
                Window to Previous Screen: "Meta+Shift+Left,Meta+Shift+Left,Move Window to Previous Screen"
