---
- name: Bootstrap a system
  hosts: all
  gather_facts: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    # Whether to bootstrap a graphical environment.  This assumes a Debian or
    # Ubuntu system.
    graphical: false
    # Whether to bootstrap a development environment.  This assumes a Debian or
    # Ubuntu system.
    development: false
    apt_repos:
      - repository: 1Password
        remote_keyring: https://downloads.1password.com/linux/keys/1password.asc
        downloaded_keyring: /usr/share/keyrings/1password-archive-keyring.gpg.asc
        keyring: /usr/share/keyrings/1password-archive-keyring.gpg
        sources_list_path: /etc/apt/sources.list.d/1password.list
        packages:
          - 1password
          - 1password-cli
        condition: "{{ graphical and ansible_userspace_architecture == 'x86_64' }}"
      - repository: GitHub CLI
        remote_keyring: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        downloaded_keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        sources_list_path: /etc/apt/sources.list.d/github-cli.list
        packages: ~
        condition: '{{ development and (ansible_distribution != "Debian" or ansible_distribution_version == "n/a") }}'
  tasks:
    - name: Check if this is a minimized Ubuntu image
      stat:
        path: /etc/dpkg/dpkg.cfg.d/excludes
        get_checksum: no
        get_mime: no
        get_attributes: no
      register: minimized_image
    - name: Install manual pages
      shell: 'yes | unminimize'
      become: true
      become_user: root
      ignore_errors: true
      when: minimized_image.stat.exists
    - name: Install git-core PPA
      apt_repository:
        repo: ppa:git-core/ppa
      become: true
      become_user: root
      when: ansible_distribution == 'Ubuntu'
    - name: Install neovim-stable PPA
      apt_repository:
        repo: ppa:neovim-ppa/stable
      become: true
      become_user: root
      when: ansible_distribution == 'Ubuntu'
    - name: Disable /tmp as tmpfs
      shell: systemctl mask tmp.mount
      become: true
      become_user: root
      ignore_errors: true
    - name: Set up proper /tmp cleaning
      copy:
        src: "{{ playbook_dir }}/files/etc/tmpfiles.d/tmp.conf"
        dest: "/etc/tmpfiles.d/tmp.conf"
        owner: root
        group: root
        mode: "644"
      become: true
      become_user: root
      ignore_errors: true
    - name: Install Debian packages
      apt:
        pkg:
          - bc
          - curl
          - dc
          - git
          - gnupg
          - less
          - libpam-tmpdir
          - locales-all
          - make
          - man-db
          - manpages
          - manpages-dev
          - ncurses-term
          - neovim
          - nvi
          - openssh-client
          - perl
          - procps
          - python3
          - rsync
          - ruby
          - ruby-neovim
          - sshfs
          - sudo
          - tmux
          - xxd
          - zsh
        update_cache: true
      become: true
      become_user: root
      when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'
    - name: Install optional packages
      apt:
        pkg:
          - openssh-client-gssapi
      become: true
      become_user: root
      ignore_errors: true
      when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'
    - name: Install FreeBSD packages
      package:
        name:
          - curl
          - fusefs-sshfs
          - git
          - gmake
          - gnupg
          - less
          - ncurses
          - neovim
          - perl5
          - python3
          - rsync
          - ruby
          - rubygem-neovim
          - tmux
          - xxd
          - zsh
      become: true
      become_user: root
      when: ansible_distribution == 'FreeBSD'
    - name: Install graphical and desktop packages
      apt:
        pkg:
          - alacritty
          - buildah
          - chrony
          - clementine
          - dconf-cli
          - docker.io
          - elinks
          - fontconfig
          - libsecret-tools
          - mate-desktop
          - mutt
          - podman
          - podman-toolbox
          - texlive-fonts-extra
          - tmuxinator
          - traceroute
          - urlview
          - xclip
      become: true
      become_user: root
      when: graphical
    - name: Install Firefox ESR
      apt:
        pkg:
          - firefox-esr
      become: true
      become_user: root
      # ansible_distribution_version is "n/a" on sid.  Otherwise, it contains
      # the version number.
      when: graphical and ansible_distribution == 'Debian' and ansible_distribution_version != "n/a"
    - name: Install Firefox
      apt:
        pkg:
          - firefox
      become: true
      become_user: root
      when: graphical and (ansible_distribution != 'Debian' or ansible_distribution_version == "n/a")
    - name: Install APT repositories
      include_tasks: "{{ playbook_dir }}/install-apt-repo.yaml"
      loop: "{{ apt_repos }}"
    - name: Install development packages
      apt:
        pkg:
          - build-essential
          - gh
          - git-autofixup
      become: true
      become_user: root
      when: development
