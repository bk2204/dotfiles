---
- name: Bootstrap a system
  hosts: all
  gather_facts: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    # Whether to bootstrap a graphical environment.  This assumes a Debian,
    # Ubuntu, or macOS system.
    graphical: false
    # Whether to bootstrap a development environment.  This assumes a Debian,
    # Ubuntu, or macOS system.
    development: false
    apt_repos:
      - repository: 1Password
        remote_keyring: https://downloads.1password.com/linux/keys/1password.asc
        downloaded_keyring: /usr/share/keyrings/1password-archive-keyring.gpg.asc
        keyring: /usr/share/keyrings/1password-archive-keyring.gpg
        sources_list_path: /etc/apt/sources.list.d/1password.list
        packages:
          - 1password
          - 1password-cli
        condition: '{{ graphical and ansible_facts["userspace_architecture"] == "x86_64" }}'
      - repository: GitHub CLI
        remote_keyring: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        downloaded_keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        keyring: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        sources_list_path: /etc/apt/sources.list.d/github-cli.list
        packages: ~
        condition: '{{ development and (ansible_facts["distribution"] != "Debian" or ansible_facts["distribution_version"] == "n/a") }}'
  tasks:
    - name: Check if this is a minimized Ubuntu image
      stat:
        path: /etc/dpkg/dpkg.cfg.d/excludes
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: minimized_image
    - name: Install manual pages
      shell: 'yes | unminimize'
      become: true
      become_user: root
      ignore_errors: true
      when: minimized_image.stat.exists
    - name: Disable /tmp as tmpfs
      shell: systemctl mask tmp.mount
      become: true
      become_user: root
      ignore_errors: true
    - name: Set up proper /tmp cleaning
      copy:
        src: "{{ playbook_dir }}/files/etc/tmpfiles.d/tmp.conf"
        dest: "/etc/tmpfiles.d/tmp.conf"
        owner: root
        group: root
        mode: "644"
      become: true
      become_user: root
      ignore_errors: true
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
    - name: Install Debian packages
      include_tasks: "{{ playbook_dir }}/bootstrap-deb.yaml"
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
    - name: Install FreeBSD packages
      include_tasks: "{{ playbook_dir }}/bootstrap-freebsd.yaml"
      when: ansible_facts["distribution"] == 'FreeBSD'
    - name: Configure DNSSEC in local resolver
      shell: "ruby -e 'x = %w[edns0 trust-ad]; res = []; f = File.open(ARGV[0], %q[r+]); while f.gets; if $_ =~ /^options/; x.each { |i| $_.sub!(/$/, %Q[ #{i}]) unless $_ =~ / #{i}/ }; x = []; end; res << $_; end; res << %Q[options #{x.join(%q[ ])}] if f.eof? && !x.empty?; f.rewind; f.truncate(0); f.puts res' /etc/resolv.conf"
      become: true
      become_user: root
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
