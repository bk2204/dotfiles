---
- name: Bootstrap a system
  hosts: all
  gather_facts: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    NONINTERACTIVE: 1
    PATH: /usr/local/sbin:/usr/local/bin:/opt/homebrew/sbin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/sbin:/home/linuxbrew/.linuxbrew/bin:/usr/bin:/usr/sbin:/bin:/sbin
  vars:
    # Whether to bootstrap a graphical environment.  This assumes a Debian,
    # Ubuntu, or macOS system.
    graphical: false
    # Whether to bootstrap a development environment.  This assumes a Debian,
    # Ubuntu, or macOS system.
    development: false
    homebrew: '{{ ansible_facts["os_family"] == "Darwin" }}'
    apt_repos:
      - repository: 1Password
        remote_keyring: https://downloads.1password.com/linux/keys/1password.asc
        downloaded_keyring: /usr/share/keyrings/1password-archive-keyring.gpg.asc
        keyring: /usr/share/keyrings/1password-archive-keyring.gpg
        sources_list_path: /etc/apt/sources.list.d/1password.list
        packages:
          - 1password
          - 1password-cli
        condition: '{{ graphical and ansible_facts["userspace_architecture"] == "x86_64" }}'
  tasks:
    - name: Check if this is a minimized Ubuntu image
      stat:
        path: /etc/dpkg/dpkg.cfg.d/excludes
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: minimized_image
    - name: Install manual pages
      shell: 'yes | unminimize'
      become: true
      become_user: root
      ignore_errors: true
      when: minimized_image.stat.exists
    - name: Disable /tmp as tmpfs
      shell: systemctl mask tmp.mount
      become: true
      become_user: root
      ignore_errors: true
    - name: Set up proper /tmp cleaning
      copy:
        src: "{{ playbook_dir }}/files/etc/tmpfiles.d/tmp.conf"
        dest: "/etc/tmpfiles.d/tmp.conf"
        owner: root
        group: root
        mode: "644"
      become: true
      become_user: root
      ignore_errors: true
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
    - name: Set up appropriate environment variables
      copy:
        src: "{{ playbook_dir }}/files/etc/environment.d/99-local.conf"
        dest: "/etc/environment.d/99-local.conf"
        owner: root
        group: root
        mode: "644"
      become: true
      become_user: root
      ignore_errors: true
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
    - name: Install Debian packages
      include_tasks: "{{ playbook_dir }}/bootstrap-deb.yaml"
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu'] and not homebrew
    - name: Install FreeBSD packages
      include_tasks: "{{ playbook_dir }}/bootstrap-freebsd.yaml"
      when: ansible_facts["distribution"] == 'FreeBSD'
    - name: Install Homebrew packages
      include_tasks: "{{ playbook_dir }}/bootstrap-homebrew.yaml"
      when: homebrew
    - name: Check if git-autofixup is installed
      shell: command -v git-autofixup
      register: autofixup_check
      ignore_errors: true
    - name: Install git-autofixup
      get_url:
        dest: '/usr/local/bin/git-autofixup'
        mode: 0755
        url: https://raw.githubusercontent.com/torbiak/git-autofixup/55e32975088c0184e356085834995dc42245c25f/git-autofixup
        checksum: sha256:d76e33715e3a25ed924f47878b8d9cfd6693bc6b121664661195c1a0914a3b11
      become: true
      become_user: root
      when: development and autofixup_check.rc != 0
    - name: Configure DNSSEC in local resolver
      shell: "ruby -e 'x = %w[edns0 trust-ad]; res = []; f = File.open(ARGV[0], %q[r+]); while f.gets; if $_ =~ /^options/; x.each { |i| $_.sub!(/$/, %Q[ #{i}]) unless $_ =~ / #{i}/ }; x = []; end; res << $_; end; res << %Q[options #{x.join(%q[ ])}] if f.eof? && !x.empty?; f.rewind; f.truncate(0); f.puts res' /etc/resolv.conf"
      become: true
      become_user: root
      when: ansible_facts["distribution"] in ['Debian', 'Ubuntu']
