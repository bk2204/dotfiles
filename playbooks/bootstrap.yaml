---
- name: Bootstrap a system
  hosts: all
  gather_facts: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    # Whether to bootstrap a graphical environment.  This assumes a Debian or
    # Ubuntu system.
    graphical: false
    # Whether to bootstrap a development environment.  This assumes a Debian or
    # Ubuntu system.
    development: false
    op_keyring: /usr/share/keyrings/1password-archive-keyring.gpg
  tasks:
    - name: Check if this is a minimized Ubuntu image
      stat:
        path: /etc/dpkg/dpkg.cfg.d/excludes
        get_checksum: no
        get_mime: no
        get_attributes: no
      register: minimized_image
    - name: Install manual pages
      shell: 'yes | unminimize'
      become: true
      become_user: root
      ignore_errors: true
      when: minimized_image.stat.exists
    - name: Install git-core PPA
      apt_repository:
        repo: ppa:git-core/ppa
      become: true
      become_user: root
      when: ansible_distribution == 'Ubuntu'
    - name: Install neovim-stable PPA
      apt_repository:
        repo: ppa:neovim-ppa/stable
      become: true
      become_user: root
      when: ansible_distribution == 'Ubuntu'
    - name: Disable /tmp as tmpfs
      shell: systemctl mask tmp.mount
      become: true
      become_user: root
      ignore_errors: true
    - name: Set up proper /tmp cleaning
      copy:
        src: "{{ playbook_dir }}/files/etc/tmpfiles.d/tmp.conf"
        dest: "/etc/tmpfiles.d/tmp.conf"
        owner: root
        group: root
        mode: "644"
      become: true
      become_user: root
      ignore_errors: true
    - name: Install Debian packages
      apt:
        pkg:
          - bc
          - curl
          - dc
          - git
          - gnupg
          - less
          - libpam-tmpdir
          - locales-all
          - make
          - man-db
          - manpages
          - manpages-dev
          - ncurses-term
          - neovim
          - nvi
          - perl
          - procps
          - python3
          - rsync
          - ruby
          - ruby-neovim
          - sshfs
          - sudo
          - tmux
          - xxd
          - zsh
        update_cache: true
      become: true
      become_user: root
      when: ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu'
    - name: Install FreeBSD packages
      package:
        name:
          - curl
          - fusefs-sshfs
          - git
          - gmake
          - gnupg
          - less
          - ncurses
          - neovim
          - perl5
          - python3
          - rsync
          - ruby
          - rubygem-neovim
          - tmux
          - xxd
          - zsh
      become: true
      become_user: root
      when: ansible_distribution == 'FreeBSD'
    - name: Install graphical and desktop packages
      apt:
        pkg:
          - alacritty
          - buildah
          - clementine
          - docker.io
          - fontconfig
          - libsecret-tools
          - mate-desktop
          - mutt
          - podman
          - podman-toolbox
          - texlive-fonts-extra
          - tmuxinator
          - urlview
          - xclip
      become: true
      become_user: root
      when: graphical
    - name: Install Firefox ESR
      apt:
        pkg:
          - firefox-esr
      become: true
      become_user: root
      # ansible_distribution_version is "n/a" on sid.  Otherwise, it contains
      # the version number.
      when: graphical and ansible_distribution == 'Debian' and ansible_distribution_version != "n/a"
    - name: Install Firefox
      apt:
        pkg:
          - firefox
      become: true
      become_user: root
      when: graphical and (ansible_distribution != 'Debian' or ansible_distribution_version == "n/a")
    - name: Check for 1Password keyring
      stat:
        path: "{{ op_keyring }}"
        get_checksum: no
        get_mime: no
      register: opkeyring
    - name: Download 1Password keyring
      get_url:
        dest: "{{ op_keyring }}.asc"
        mode: 0644
        owner: root
        group: root
        url: https://downloads.1password.com/linux/keys/1password.asc
        use_netrc: false
      become: true
      become_user: root
      when: graphical and ansible_userspace_architecture == 'x86_64' and not opkeyring.stat.exists
    - name: Dearmor 1Password keyring
      command: "gpg --dearmor --output {{ op_keyring }} {{ op_keyring }}.asc"
      become: true
      become_user: root
      when: graphical and ansible_userspace_architecture == 'x86_64' and not opkeyring.stat.exists
    - name: Set up 1Password sources.list entry
      copy:
        src: "{{ playbook_dir }}/files/etc/apt/sources.list.d/1password.list"
        dest: "/etc/apt/sources.list.d/1password.list"
        owner: root
        group: root
        mode: "644"
      become: true
      become_user: root
      when: graphical and ansible_userspace_architecture == 'x86_64'
    - name: Install 1Password
      apt:
        pkg:
          - 1password
          - 1password-cli
        update_cache: true
      become: true
      become_user: root
      when: graphical and ansible_userspace_architecture == 'x86_64'
    - name: Install development packages
      apt:
        pkg:
          - build-essential
          - git-autofixup
      become: true
      become_user: root
      when: development
