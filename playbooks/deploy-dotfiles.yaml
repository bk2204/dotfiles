---
- name: Deploy dotfiles and configuration
  hosts: all
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    checkouts_dir: /home/{{ ansible_user_id }}/checkouts
    branch: dev
    fonts_src: /usr/share/texlive/texmf-dist/fonts/opentype/adobe
    fonts_dest: adobe
    group: "{{ ansible_user_id }}"
    dotfiles_config: 'config/config-dev.yaml'
    private_dotfiles: true
  tasks:
    - name: Create the directory
      file:
        path: '{{ checkouts_dir }}'
        state: directory
        owner: '{{ ansible_user_id }}'
        group: '{{ group }}'
    - name: Clone dotfiles
      git:
        repo: https://github.com/bk2204/dotfiles.git
        remote: def
        dest: '{{ checkouts_dir }}/dotfiles'
        version: '{{ branch }}'
    - name: Determine config
      stat:
        path: '{{ checkouts_dir }}/dotfiles/config.yaml'
        follow: false
      register: config
    - name: Set default config
      file:
        src: '{{ dotfiles_config }}'
        dest: '{{ checkouts_dir }}/dotfiles/config.yaml'
        owner: '{{ ansible_user_id }}'
        group: '{{ ansible_user_id }}'
        state: link
      when: config.stat.exists is defined and not config.stat.exists
    - name: Checkout submodules for dotfiles
      shell: 'git submodule update --init'
      args:
        chdir: '{{ checkouts_dir }}/dotfiles'
    - name: Deploy dotfiles with make
      shell: 'make install'
      args:
        chdir: '{{ checkouts_dir }}/dotfiles'
      when: ansible_distribution != 'FreeBSD'
    - name: Deploy dotfiles with gmake
      shell: 'gmake install'
      args:
        chdir: '{{ checkouts_dir }}/dotfiles'
      when: ansible_distribution == 'FreeBSD'
    # This happens after the initial deployment because we need the ssh config
    # to set VerifyHostKeyDNS for us.
    - name: Clone dotfiles-private
      git:
        repo: ssh://git@git.crustytoothpaste.net/bmc/dotfiles-private.git
        remote: def
        dest: '{{ checkouts_dir }}/dotfiles-private'
        version: '{{ branch }}'
      when: private_dotfiles
    - name: Re-deploy dotfiles with make
      shell: 'make install'
      args:
        chdir: '{{ checkouts_dir }}/dotfiles'
      when: ansible_distribution != 'FreeBSD'
    - name: Re-deploy dotfiles with gmake
      shell: 'gmake install'
      args:
        chdir: '{{ checkouts_dir }}/dotfiles'
      when: ansible_distribution == 'FreeBSD'
    - name: Create .local directory
      file:
        path: '/home/{{ ansible_user_id }}/.local'
        state: directory
    - name: Create .local/share directory
      file:
        path: '/home/{{ ansible_user_id }}/.local/share'
        state: directory
    - name: Create .local/run directory
      file:
        path: '/home/{{ ansible_user_id }}/.local/run'
        state: directory
    - name: Create Lawn directory
      file:
        path: '/home/{{ ansible_user_id }}/.local/run/lawn'
        state: directory
    - name: Create fonts directory
      file:
        path: '/home/{{ ansible_user_id }}/.local/share/fonts'
        state: directory
    - name: Check for fonts
      stat:
        path: "{{ fonts_src }}"
        get_checksum: false
        get_mime: false
      register: fonts
    - name: Create font symlink
      file:
        state: link
        src: "{{ fonts_src }}"
        dest: '/home/{{ ansible_user_id }}/.local/share/fonts/{{ fonts_dest }}'
      when: fonts.stat.exists and fonts.stat.isdir
    - name: Regenerate font cache
      shell: fc-cache
      when: fonts.stat.exists and fonts.stat.isdir
