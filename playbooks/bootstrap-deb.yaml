---
- name: Install PPA prerequisites
  apt:
    pkg:
      - gnupg
  become: true
  become_user: root
- name: Install git-core PPA
  apt_repository:
    repo: ppa:git-core/ppa
  become: true
  become_user: root
  when: ansible_facts["distribution"] == 'Ubuntu'
- name: Install neovim-stable PPA
  apt_repository:
    repo: ppa:neovim-ppa/stable
  become: true
  become_user: root
  when: ansible_facts["distribution"] == 'Ubuntu'
- name: Create /etc/apt/keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  become_user: root
- name: Create tmp directory
  file:
    path: '{{ ansible_facts["user_dir"] }}/tmp'
    state: directory
  when: ansible_facts["distribution"] == 'Ubuntu' and ansible_facts["distribution_version"] == '20.04'
- name: Download neovim package
  get_url:
    dest: '{{ ansible_facts["user_dir"] }}/tmp/nvim-linux-x86_64.deb'
    mode: 0640
    url: https://github.com/neovim/neovim-releases/releases/download/v0.10.4/nvim-linux-x86_64.deb
    use_netrc: false
    checksum: sha256:d26f9c0478702c7632a6436f952dc425924cb28dad2184382ce8f138e347f608
  when: ansible_facts["distribution"] == 'Ubuntu' and ansible_facts["distribution_version"] == '20.04'
- name: Install neovim package
  command: dpkg -i {{ ansible_facts["user_dir"] }}/tmp/nvim-linux-x86_64.deb
  become: true
  become_user: root
  when: ansible_facts["distribution"] == 'Ubuntu' and ansible_facts["distribution_version"] == '20.04'
- name: Install Debian packages
  apt:
    pkg:
      - bc
      - curl
      - dc
      - git
      - jq
      - less
      - libpam-tmpdir
      - locales-all
      - make
      - man-db
      - manpages
      - manpages-dev
      - ncurses-term
      - neovim
      - nvi
      - openssh-client
      - perl
      - procps
      - python3
      - rename
      - rsync
      - ruby
      - ruby-neovim
      - sshfs
      - sudo
      - tmux
      - xxd
      - zsh
    update_cache: true
  become: true
  become_user: root
- name: Install optional packages
  apt:
    pkg:
      - openssh-client-gssapi
  become: true
  become_user: root
  ignore_errors: true
- name: Install graphical and desktop packages
  apt:
    pkg:
      - asciidoctor
      - bind9-dnsutils
      - bind9-host
      - buildah
      - chrony
      - dconf-cli
      - docker.io
      - docbook5-xml
      - docbook-xsl-ns
      - elinks
      - fontconfig
      - kitty
      - krb5-user
      - libsecret-tools
      - mate-desktop
      - mutt
      - pandoc
      - podman
      - podman-toolbox
      - ruby-asciidoctor-pdf
      - strawberry
      - texlive-fonts-extra
      - tmuxinator
      - traceroute
      - urlview
      - xclip
      - xsltproc
  become: true
  become_user: root
  when: graphical
- name: Install Firefox ESR
  apt:
    pkg:
      - firefox-esr
  become: true
  become_user: root
  # ansible_facts["distribution_version"] is "n/a" on sid.  Otherwise, it contains
  # the version number.
  when: graphical and ansible_facts["distribution"] == 'Debian' and ansible_facts["distribution_version"] != "n/a" and not homebrew
- name: Install Firefox
  apt:
    pkg:
      - firefox
  become: true
  become_user: root
  when: graphical and (ansible_facts["distribution"] == 'Ubuntu' or (ansible_facts["distribution"] == 'Debian' and ansible_facts["distribution_version"] == "n/a"))
- name: Install APT repositories
  include_tasks: "{{ playbook_dir }}/install-apt-repo.yaml"
  loop: "{{ apt_repos }}"
- name: Install development packages
  apt:
    pkg:
      - build-essential
      - hunspell
      - hunspell-en-us
      - hunspell-en-ca
      - hunspell-es
      - hunspell-fr-classical
  become: true
  become_user: root
  when: development
- name: Install optional development packages
  apt:
    pkg:
      - '{{ item }}'
  become: true
  become_user: root
  ignore_errors: true
  when: development
  loop:
    - gh
    - git-autofixup
